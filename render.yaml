# Despliegue en Render (https://render.com): New › Blueprint › elegir este repositorio.
# Plan gratuito: ideal para probar. Los datos (pedidos, fotos subidas) se reinician
# cuando el servicio se reinicia; para producción usa un plan con disco persistente
# (descomenta "disk" y DATA_DIR).
services:
  - type: web
    name: elcatavinos
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /robots.txt
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_EMAIL
        value: admin@elcatavinos.net
      - key: ADMIN_PASSWORD
        generateValue: true
      # - key: DATA_DIR
      #   value: /var/data
    # disk:
    #   name: datos
    #   mountPath: /var/data
    #   sizeGB: 1
